# DAOLib's documentation site (DAOLib #45, #49): built by tools/build_docs.py
# (Doxygen 1.18 for the headers' XML, Jekyll with Just the Docs for the site)
# and published to GitHub Pages on a push to master or a release tag. The site's root is master's docs ("Current"); each vX.Y.Z tag is built
# from its own headers into X.Y.Z/ for the version selector, and kept in the
# Actions cache between runs (DAOLib #201). A pull request
# that touches the docs builds the site without publishing it.

name: Documentation

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    paths:
      - 'docs/**'
      - 'dev/PLUGINS.md'
      - 'src/dao/*.h'
      - 'tools/build_docs.py'
      - 'tools/doxygen_filter.py'
      - 'tools/doxygen_xml.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  DOXYGEN_VERSION: '1.18.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Every tag, for each release's docs; a tag push builds the whole
          # site from master plus all release tags.
          fetch-depth: 0
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'master' || github.ref }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Doxygen
        # The version the XML was read with here; the distribution's is older.
        run: |
          version_tag="Release_${DOXYGEN_VERSION//./_}"
          curl -sSL "https://github.com/doxygen/doxygen/releases/download/${version_tag}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"
      - run: doxygen --version
      - name: Release tags
        id: tags
        run: echo "hash=$(git tag --list 'v*' --format='%(refname:short) %(objectname)' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Each release's built site, kept by build_docs.py under a hash of what
      # makes it (DAOLib #201). The key changes with those files or the tags,
      # so a new entry is saved then; an older entry is restored and
      # build_docs.py uses what of it still matches.
      - uses: actions/cache@v4
        with:
          path: build/docs-cache
          key: docs-${{ env.DOXYGEN_VERSION }}-${{ hashFiles('tools/build_docs.py', 'tools/doxygen_xml.py', 'tools/doxygen_filter.py', 'docs/**') }}-${{ steps.tags.outputs.hash }}
          restore-keys: docs-
      - run: python tools/build_docs.py
      - name: Doxygen's warnings
        run: |
          if [ -s build/docs-site/warnings.txt ]; then
            cat build/docs-site/warnings.txt
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/docs-site/DAOLib

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
